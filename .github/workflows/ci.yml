name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API Spring Boot (unit + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        working-directory: api-fraud
        run: mvn -B --no-transfer-progress verify
      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api-fraud/target/surefire-reports
            api-fraud/target/failsafe-reports

  spark:
    name: Job Spark (pytest dans l'image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image Spark
        uses: docker/build-push-action@v6
        with:
          context: processing
          load: true
          tags: fraud-spark:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: pytest
        run: docker run --rm --entrypoint python3 fraud-spark:ci -m pytest /app/tests -q

  producer:
    name: Producer Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements*.txt
      - name: Dépendances
        working-directory: ingestion
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        working-directory: ingestion
        run: python -m pytest tests -q

  frontend:
    name: Console analyste (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npx vite build

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose --profile app --profile tools config -q
