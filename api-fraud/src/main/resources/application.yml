server:
  port: 8080

spring:
  application:
    name: fraud-api
  datasource:
    # Par défaut : PostgreSQL du docker-compose exposé sur l'hôte (port 5433)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/frauddb}
    username: ${SPRING_DATASOURCE_USERNAME:fraud}
    password: ${SPRING_DATASOURCE_PASSWORD:fraud}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # le schéma est géré par docker/postgres/init/01_schema.sql
    properties:
      hibernate:
        default_schema: fraud
        jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null

app:
  security:
    # Secret HS256 (>= 32 octets). À SURCHARGER hors développement : APP_JWT_SECRET
    jwt-secret: ${APP_JWT_SECRET:dev-only-secret-change-me-fraud-detection-platform-2026}
    token-ttl: ${APP_JWT_TTL:8h}
    # Comptes de démonstration (mots de passe bcrypt) : analyst / analyst123, supervisor / supervisor123
    users:
      - username: analyst
        password: "$2b$10$M3eufiIDPCqwsgHELZEEW.VxVOOTN9DQrnbc8XKxx1H3bkCOWVK2W"
        roles: [ANALYST]
      - username: supervisor
        password: "$2b$10$DYHXbYaAyhiq5GQ/FOGVZuqmMg6Nsq5r/iEqFt7f3rZXK2ixMAkd6"
        roles: [ANALYST, SUPERVISOR]

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.frauddetection: INFO
